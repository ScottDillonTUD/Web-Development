<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wheels On Fire - Contact</title>
    <script src="https://kit.fontawesome.com/a5907eba45.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="/css/styles.css" />
</head>

<body>
    <nav class="menu">
        <a href="/index.html" class="logo-container">
            <span class="site-title">Wheels On Fire</span> 
        </a>
        <div class="nav-links">
            <a href="/index.html" class="nav-link">Home</a>
            <a href="/pages/contact.html" class="nav-link">Contact</a>
            <a href="/pages/about.html" class="nav-link">About</a>
            <a href="/pages/news.html" class="nav-link">News</a>
        </div>
    </nav>
 
    <div class="contact-container">
        <h1>Contact Us</h1>
        <p class="contact-text">We'd love to hear from you!</p>

        <form class="contact-form" id="contactForm" action="/submit" method="POST" novalidate>
            <fieldset>
                <legend class="form-legend">Leave us a message</legend>

                <div class="form-group">
                    <label for="first_name" class="form-label">First name:</label>
                    <input type="text" id="first_name" name="first_name" placeholder="e.g. John">
                    <div class="error-msg" id="error-first_name"></div>
                </div>
                
                <div class="form-group">
                    <label for="last_name" class="form-label">Last name:</label>
                    <input type="text" id="last_name" name="last_name" placeholder="e.g. Doe">
                    <div class="error-msg" id="error-last_name"></div>
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">Email Address:</label>
                    <input type="email" id="email" name="email" placeholder="john@example.com">
                    <div class="error-msg" id="error-email"></div>
                </div>

                <div class="form-group">
                    <label for="reason" class="form-label">Reason for Inquiry:</label>
                    <select id="reason" name="reason">
                        <option value="">-- Please Select --</option> 
                        <option value="general">General</option> 
                        <option value="feedback">Feedback</option>
                        <option value="technical">Technical Support</option>
                    </select>
                    <div class="error-msg" id="error-reason"></div>
                </div>

                <div class="form-group">
                    <label for="comment" class="form-label">Message:</label>
                    <textarea id="comment" name="comment"></textarea>
                    <div class="error-msg" id="error-comment"></div>
                </div>

                <button type="submit" class="submit-button">Send Message</button>
            </fieldset>
        </form>
    </div>

    <div class="spacer"></div>

    <footer>
        <p class="footer-text">© 2025 Wheels On Fire - All Rights Reserved</p>
    </footer>

    <script src="/js/main.js"></script>
</body>
</html>
